<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            background-color: darkseagreen;
            padding: 2rem;
            margin: 2rem auto;
            width: 30rem;
        }
        h1{
            margin: 2rem auto;
            width: 30rem;
        }
        label{
            display: inline-block;
            width: 7rem;
            
        }
        input{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background-color: rgb(219, 234, 219);
            border: 1px dashed solid black;
            padding: 1rem;
            margin: 1rem;
            width: 18rem;
            
        }
    </style>
</head>
<body>
    <h1>CADASTRO DE ESTÁGIO </h1>
    <form action="resultado.html" method="get">
        <!-- Form: Demarca a área do formulário.
            - uma página pode ter vários formulários;
            - cada formulário deve ter um botão de submissão;
            - o atributo de action é responsável por receber os dados;
            - o atributo method é o método de envio.
          -->
        <label for="nome">
            <!-- Label: Rótulo -->
            Nome:
            <!-- Input: entrada de dados de texto -->
        </label>
        <input type="text" id="nome"> <br>
        <label for="email">
            <!-- O atributo de for, na marcação de "label" cria um vínculo com o input. Além disso,
                o valor do "id" do input precisa ser igual ao no "for" -->
            Email:
        </label>
        <input type="email" id="email"> <br>
        <label for="senha">
            Senha:
        </label>
        <input type="password" id="senha"> <br>
        <!-- input do tipo senha deixa os dados "invisíveis"  -->

        <input type="submit" value="ENVIAR">
    </form>
</body>
</html>
