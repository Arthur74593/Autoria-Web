<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-sizing</title>
    <style>
        div{
            border: 1px solid black;
            /* borda espessura, estilo e cor */
            margin: 2rem auto;
            /* 
            margin e padding
            4 valores: top, right, bottom e left
            3 valores: top, right/left, bottom
            2 valores: top/bottom, left/right
            1 valor: todos */

            max-width: 70rem;
            
            background-color: aqua;
            text-align: center;
            height: 10rem;
            padding: 2rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div>
        DIV
    </div>
    
</body>
</html>
