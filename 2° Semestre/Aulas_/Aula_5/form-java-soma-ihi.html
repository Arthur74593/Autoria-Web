<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>FOrmulário de somar</h1>

    <label for="n1">N1: </label>
    <input type="number" id="n1"><br>

    <label for="n2">N2: </label>
    <input type="number" id="n2">

    <button id="somar">SOMAR</button>
    <!-- 
    Marcação de button mais usada no JavaScript
    -->
    <p id="resultado"></p>
    <script>
        // alert("Olá Mundo");
        console.log("Olá Mundo");
        document.write("Olá Mundo");
        const resultado = document.getElementById("resultado");
        resultado.innerHTML = "Oláaaaaa Mundoooo!";

        const somar = document.getElementById('somar')

        somar.addEventListener("click", function(e){
            // chama um evento de click
            const n1 = document.getElementById("n1").value;
            // número digitado no campo 1
            const n2 = document.getElementById("n2").value;
            let soma = parseFloat(n1) + parseInt(n2);
            resultado.innerHTML = soma 
        })
    </script>
    
</body>
</html>
