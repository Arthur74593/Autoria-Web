<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submenu</title>
    <style>
        body > ol{  /* o sinal de maior representa a seleção de um elemento que é filho direto do marcador.*/
            display: flex;
        }
        li{
            position: relative;
            margin-right: 2rem;
        }
        ol ol{
            position: absolute;
            background-color: aqua;
            padding: 2rem;
            visibility: hidden;
        }
        body > ol > li:hover ol{
            visibility: visible;
        }
    </style>
</head>
<body>
    <ol>
        <li>Página Inicial</li>
        <li>Programação
            <ol>
                <li>Palestras</li>
                <li>Mesas</li>
                <li>Minicursos</li>
            </ol>
        </li>
        <li>Palestrantes</li>
        <li>Organização</li>
        <li>Exposição
            <ol>
                <li>Tech</li>
                <li>Empreendedorismo</li>
                <li>Projetos</li>
            </ol>
        </li>
        <li>Contato</li>
    </ol>
        
</body>
</html>
